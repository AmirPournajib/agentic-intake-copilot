[project]
name = "agentic-intake-copilot"
version = "0.1.0"
description = "Tested reference for agentic AI workflows: agent roles, typed tools, guardrails in code, human-review gate, traces and evals in CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amir Pournajib" }]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
